# Host name of the Ingress or Route; required if one of them is created
hostName: ""

# Whether Pubgrade builds images itself. Must match `endpoints.builds.enabled`
# in the app's configuration. Off (the default), it takes prebuilt images, and
# the chart creates no updater, shared volume, service account rights or build
# settings
builds:
  enabled: false
  # With builds on, the name of an existing Secret with the keys
  # `gh_access_token`, `cosign_password`, `cosign_private_key` and, unless
  # `builds.registry` names another Secret, `intermediate_registry_token`
  existingSecret: ""
  # URL at which the build pods reach Pubgrade
  pubgradeUrl: ""
  # The registry that build pods push images to, from which the signing
  # workflow pulls them; any OCI registry, e.g., Harbor. Used unless the app's
  # configuration sets `endpoints.builds.intermediate_registery_format`
  registry:
    # Host, with its port if needed; Docker Hub by default
    host: docker.io
    # Namespace of the images, e.g., a Harbor project or a Docker Hub
    # organization; images go to `<host>/<namespace>/<name>`
    namespace: ""
    # Secret and key with the registry's credentials, base64 of
    # `<user>:<password>` (e.g., of a Harbor robot account); by default the
    # key `intermediate_registry_token` of `builds.existingSecret`
    existingSecret: ""
    key: intermediate_registry_token
  # The volume that Pubgrade and the build pods share
  volume:
    storageClass: ""
    size: 2Gi
  updater:
    # In the repository `dev`, which follows the branch; the chart of a
    # release uses the image of the release. Pin `X.Y.Z` or `sha-<commit>` to
    # control upgrades
    image: elixircloud/pubgrade-updater:dev
    imagePullPolicy: Always
    resources: {}
    # Security contexts of the pod and the container, as for `pubgrade`
    podSecurityContext: {}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

pubgrade:
  # In the repository `dev`, which follows the branch; the chart of a release
  # uses the image of the release. Pin `X.Y.Z` or `sha-<commit>` to control
  # upgrades
  image: elixircloud/pubgrade:dev
  imagePullPolicy: Always
  replicaCount: 1
  port: 8080
  # Name of an existing Secret with the key `config.yaml`, the app's whole
  # configuration (see `pubgrade/config.yaml`); it holds the tokens of the admin
  # users. Without it, the app runs with the configuration in the image, which
  # has no admin users, so that users can't be verified
  configSecret: ""
  resources: {}
  # Security contexts of the pod and the container. No fixed user ID, as
  # OpenShift assigns its own; the image's user otherwise. Clusters that set
  # their own seccomp profile and reject others (e.g., CSC Rahti) need
  # `seccompProfile: null` (or `{}`), which leaves the key out
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # Created if enabled; `hostName` is required then
  ingress:
    enabled: false
    # Ingress class; the cluster's default class if empty
    className: ""
    annotations: {}
    https:
      # Request a certificate from cert-manager (via `issuer`, a ClusterIssuer)
      # and serve HTTPS
      enabled: true
      issuer: letsencrypt-prod
  # An OpenShift Route, with TLS at the router: created if the cluster serves
  # Routes, unless this is off or an Ingress is enabled; `hostName` is required
  # then
  route:
    enabled: true
    annotations: {}

mongodb:
  image: mongo:7.0
  imagePullPolicy: IfNotPresent
  port: 27017
  resources: {}
  # Security contexts of the pod and the container; none by default, as the
  # image starts as root and then switches to its own user
  podSecurityContext: {}
  securityContext: {}
  volume:
    # The cluster's default storage class if empty
    storageClass: ""
    size: 2Gi
  # Allow connections only from Pubgrade's pods
  networkPolicy:
    enabled: true
