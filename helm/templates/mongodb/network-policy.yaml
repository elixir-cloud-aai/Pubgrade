{{- if .Values.mongodb.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb
spec:
  podSelector:
    matchLabels:
      {{- include "pubgrade.selectorLabels" "mongodb" | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "pubgrade.selectorLabels" "app" | nindent 14 }}
      ports:
        - port: mongodb
{{- end }}
