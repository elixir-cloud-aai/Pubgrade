# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    # The Python version of the base image in the `Dockerfile`, as in CI's
    # `docs` job
    python: "3.13"
  # The dependency group `docs` of `pyproject.toml`, from its ranges, not the
  # lock (`uv.lock`), which CI's docs job builds with; pip reads dependency
  # groups from version 25.1
  jobs:
    install:
      - python -m pip install --upgrade "pip>=25.1"
      - python -m pip install --group docs

# The documentation of Pubgrade-Sidecar is a section of this one, from the
# submodule `external/pubgrade-sidecar` (see `docs/hooks.py`)
submodules:
  include: all

mkdocs:
  configuration: mkdocs.yml
  # Fail on all warnings to avoid broken links and references
  fail_on_warning: true
