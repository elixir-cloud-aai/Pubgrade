version: 2
# Every entry targets `dev` (`target-branch`), which takes all pull
# requests whatever the default branch is (`main` only moves forward to
# releases); security updates always target the default branch, though
updates:
  # Dependencies in `pyproject.toml` and the lock (`uv.lock`), updated
  # together; the image build installs the locked ones (`Dockerfile`)
  - package-ecosystem: uv
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    versioning-strategy: increase-if-necessary
    ignore:
      # FOCA is bumped by hand, together with the base image (see the `docker`
      # entry) and the code that a newer FOCA needs, and with it connexion
      - dependency-name: foca
      - dependency-name: connexion
    groups:
      # Dependencies of the documentation (the `docs` group), in pull
      # requests of their own
      docs-dependencies:
        patterns: [
          "griffelib", "mkdocs", "mkdocs-*", "mkdocstrings", "mkdocstrings-*",
          "pymdown-extensions",
        ]
      # Dependencies match the first group listed
      python-dependencies:
        patterns: ["*"]
        exclude-patterns: ["connexion", "foca"]
  # Dependencies of the updater's image (`build-complete-updater/`)
  - package-ecosystem: pip
    directory: /build-complete-updater
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      updater-dependencies:
        patterns: ["*"]
  # Actions in the workflows, including the pins of the shared actions of
  # `elixir-cloud-aai/.github` (to the commits of its releases,
  # `@<commit> # vX.Y.Z`)
  - package-ecosystem: github-actions
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      github-actions:
        patterns: ["*"]
  # Base images in the `Dockerfile`s
  - package-ecosystem: docker
    directories: [/, /build-complete-updater]
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    ignore:
      # FOCA is bumped by hand, in the base image and the `foca` requirement
      # in `pyproject.toml` and `uv.lock` together (see the `uv` entry)
      - dependency-name: elixircloud/foca
      # The default image uses the newest Python in its security phase (3.13
      # now), rotated by hand each October (the org's Python version policy);
      # patch updates within 3.13 still come through
      - dependency-name: python
        versions: [">=3.14"]
    groups:
      docker:
        patterns: ["*"]
  # Hook revisions in `.pre-commit-config.yaml`
  - package-ecosystem: pre-commit
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      pre-commit:
        patterns: ["*"]
  # The submodule with Pubgrade-Sidecar, whose documentation is a section of
  # this one (`docs/hooks.py`), at the newest commit of its branch `dev`
  # (`.gitmodules`)
  - package-ecosystem: gitsubmodule
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
