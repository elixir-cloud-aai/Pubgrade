version: 2
# Dependencies of the app follow with the move to a newer FOCA, whose base
# image pins most of them
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      actions:
        patterns: ["*"]
  # The submodule with Pubgrade-Sidecar, whose documentation is a section of
  # this one (`docs/hooks.py`), at the newest commit of its branch `dev`
  # (`.gitmodules`)
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
