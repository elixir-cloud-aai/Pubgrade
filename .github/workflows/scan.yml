# Scan the images of the latest release (`latest`) weekly for known
# vulnerabilities with Trivy, as the `scan` job of `ci.yml` scans the images
# of pull requests and pushes, so that vulnerabilities found after a release
# are reported: the findings that have a fix are uploaded to code scanning,
# and a full report (findings without a fix included) is uploaded as the
# workflow artifact `trivy-report-release-<image>` (JSON and table).
# Accepted findings are listed in `.trivyignore.yaml`. The scan of `pubgrade`
# fails on critical and high vulnerabilities that have a fix, as CI,
# `release.yml` and cloud-registry do; `pubgrade-updater`, which isn't built on FOCA, is reported only, as in
# CI and `release.yml`. Scheduled runs use this workflow (with its pin of the
# shared action `elixir-cloud-aai/.github/actions/scan-image`) and
# `.trivyignore.yaml` as on the default branch, and file their findings
# under it. The images are public, so no Docker Hub secrets are needed; their
# organization is the variable `DOCKERHUB_ORG` (by default `elixircloud`, as
# in `ci.yml` and `release.yml`; forks set it to the organization they
# publish to).

name: Scan

on:
  schedule:
    # Mondays, 05:23 UTC
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scheduled scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pubgrade
            fail: "true"
          - image: pubgrade-updater
            fail: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@31f22fccc1f3c597ed7c1d1f75b2f85522155348 # v1.1.0
        with:
          image: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/${{ matrix.image }}:latest
          category: release-${{ matrix.image }}
          report: "true"
          fail: ${{ matrix.fail }}
