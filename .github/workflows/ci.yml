# Everything that must pass on pull requests and pushes to `dev`: the pull
# request title, the unit tests (coverage to Codecov), the chart, a smoke test
# of the image, a scan of the images (report only) and, on pushes, push the
# images by digest (with SBOM and provenance attestations), scan exactly those
# digests, then attest, sign (Sigstore) and tag them. The gate `passed` ("CI
# passed") is the only check to require. No `paths:` filters, so that the gate
# always reports; skip jobs with `if:` instead (and allow the skip in the
# gate). Runs also when a pull request is edited, so that the title check
# follows the title; all jobs run then, as a run that skipped the tests would
# report "CI passed" for the commit

name: CI
on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [dev]

permissions:
  contents: read

# Fully qualified (`docker.io/`), as the attestation needs it. The Docker Hub
# organization is the variable `DOCKERHUB_ORG` (by default `elixircloud`)
env:
  IMAGE_PREFIX: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}

# Cancel superseded runs of a pull request; runs for pushes get their own
# group, so that queued runs for successive pushes are not dropped. Runs for
# edits that leave the title unchanged share a group of their own, so that they
# cancel each other but not the run for the pull request's commit
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'push' && github.sha ||
      github.event.action == 'edited' && !github.event.changes.title &&
        format('{0}-edited', github.ref) ||
      github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Pull request titles become the commit messages on `dev` (squash merges):
  # Conventional Commits, at most 50 characters (shared action of
  # elixir-cloud-aai/.github, pinned to the commit of a release). Skipped on
  # pushes and for Dependabot, whose titles can't be configured to pass,
  # unless someone else edits the title
  title:
    name: PR title
    if: >-
      github.event_name == 'pull_request' && (
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        github.event.changes.title &&
        github.event.sender.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check PR title
        uses: elixir-cloud-aai/.github/actions/pr-title@743e82d290a53768454999e413756a924e383259 # v1.0.0

  # In the image, as the FOCA base image pins most of the dependencies
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run unit tests with coverage
        run: make test
      # Upload errors fail the workflow only on pushes, because pull requests
      # from forks and Dependabot get no access to the Codecov token
      - name: Submit report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./reports/coverage.xml
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          verbose: true

  chart:
    name: Chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Lint chart
        run: helm lint helm --strict
      - name: Render chart
        run: helm template pubgrade helm --namespace pubgrade > /dev/null

  # Starts the image with MongoDB; the network alias must match `db.host` in
  # `pubgrade/config.yaml`
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API: http://localhost:8080
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: |
          docker build --tag pubgrade:smoke .
          docker build --tag pubgrade-updater:smoke \
            --file build-complete-updater/Dockerfile .
      - name: Start app
        run: |
          docker network create smoke
          docker run --detach --name mongodb --network smoke \
            --network-alias mongodb.pubgrade-ns mongo:7.0
          for _ in $(seq 1 30); do
            if docker exec mongodb mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker run --detach --name pubgrade --network smoke \
            --publish 8080:8080 pubgrade:smoke
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null "${API}/ui/"; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::App did not respond"
          exit 1
      - name: Check API with MongoDB
        run: tests/smoke.sh "${API}"
      - name: Show app logs
        if: failure()
        run: docker logs pubgrade

  # On pushes, builds each image once and pushes it by digest only (untagged,
  # with SBOM and provenance attestations, `mode=max`), for `scan` to scan and
  # `publish` to sign and tag, as in cloud-registry. Runs alongside the tests,
  # so that the scan starts early; digests of runs that fail are never signed
  # or tagged, but stay on Docker Hub, untagged (pullable by digest only)
  push:
    name: Push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' }}
    # Docker Hub secrets; the environment only allows branch `dev`
    environment: dev-images
    permissions:
      contents: read
    outputs:
      pubgrade: ${{ steps.pubgrade.outputs.digest }}
      pubgrade-updater: ${{ steps.updater.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI labels with the commit, source and version (`dev`), shared by
      # both images; the tags are set by `publish`, after the scan
      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/pubgrade
          flavor: latest=false
          tags: type=raw,value=dev
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image by digest (pubgrade)
        id: pubgrade
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/pubgrade,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}
      - name: Build and push image by digest (pubgrade-updater)
        id: updater
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build-complete-updater/Dockerfile
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/pubgrade-updater,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}

  # Scans each image with Trivy (shared action
  # `elixir-cloud-aai/.github/actions/scan-image`): for pull requests a local
  # build, for pushes exactly the digest pushed by `push` (public, so pulling
  # it needs no login), in a job without credentials. Report only (an
  # artifact, no alerts, never failing), as the old base image has many
  # findings: this job can't pass as a gate before the move to a newer FOCA.
  # Accepted findings go into `.trivyignore.yaml`
  scan:
    name: Scan image (${{ matrix.image }})
    # For pull requests, `push` is skipped
    needs: push
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.push.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pubgrade
            file: Dockerfile
          - image: pubgrade-updater
            file: build-complete-updater/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        if: ${{ github.event_name != 'push' }}
        env:
          FILE: ${{ matrix.file }}
          IMAGE: ${{ matrix.image }}
        run: docker build --tag "${IMAGE}:scan" --file "${FILE}" .
      - name: Determine image
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ needs.push.outputs[matrix.image] }}
        run: |
          if [[ "${EVENT_NAME}" != "push" ]]; then
            echo "image=${IMAGE}:scan" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${DIGEST}'"
            exit 1
          fi
          echo "image=${IMAGE_PREFIX}/${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          image: ${{ steps.image.outputs.image }}
          category: ${{ matrix.image }}
          upload: "false"
          report: "true"
          fail: "false"

  # Attests the build provenance of the pushed digests (GitHub artifact
  # attestation, also pushed to the registry), signs them with Sigstore
  # keyless signing (`cosign`, via the workflow's OIDC token) and only then
  # tags exactly those digests: `dev` follows the branch, `sha-<commit>`
  # doesn't change. Never `latest`, which is for releases. If several commits
  # land at once, GitHub cancels queued jobs of the commits in between, which
  # then have no `sha-<commit>` tag and a failed gate: run them again if
  # needed, but the images of the newest commit are published either way
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' }}
    needs: [test, chart, smoke, push, scan]
    # Docker Hub secrets; the environment only allows branch `dev`
    environment: dev-images
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    # Publish one commit at a time, and only the newest one on the branch, so
    # that an older run cannot overwrite `dev` with older code
    concurrency:
      group: ${{ github.workflow }}-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      DIGEST_PUBGRADE: ${{ needs.push.outputs.pubgrade }}
      DIGEST_UPDATER: ${{ needs.push.outputs.pubgrade-updater }}
    steps:
      - name: Check that commit is still the branch head
        id: head
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          head=$(git ls-remote "https://github.com/${REPOSITORY}.git" "${REF}" | cut -f1)
          [ -n "${head}" ] || { echo "::error::Could not look up ${REF}"; exit 1; }
          if [ "${head}" = "${SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping publish: ${REF} has moved on to ${head}"
          fi
      - name: Check image digests
        if: steps.head.outputs.current == 'true'
        run: |
          for digest in "${DIGEST_PUBGRADE}" "${DIGEST_UPDATER}"; do
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '${digest}'"
              exit 1
            fi
          done
      - name: Set up Docker Buildx
        if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Attest build provenance (pubgrade)
        if: steps.head.outputs.current == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/pubgrade
          subject-digest: ${{ env.DIGEST_PUBGRADE }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Attest build provenance (pubgrade-updater)
        if: steps.head.outputs.current == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/pubgrade-updater
          subject-digest: ${{ env.DIGEST_UPDATER }}
          push-to-registry: true
          create-storage-record: false
      - name: Install cosign
        if: steps.head.outputs.current == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The signature covers the digest, and so every tag of it
      - name: Sign images
        if: steps.head.outputs.current == 'true'
        run: |
          cosign sign --yes "${IMAGE_PREFIX}/pubgrade@${DIGEST_PUBGRADE}"
          cosign sign --yes "${IMAGE_PREFIX}/pubgrade-updater@${DIGEST_UPDATER}"
      # A single source is copied as is
      - name: Tag images
        if: steps.head.outputs.current == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          for image in "pubgrade@${DIGEST_PUBGRADE}" "pubgrade-updater@${DIGEST_UPDATER}"; do
            name="${IMAGE_PREFIX}/${image%@*}"
            digest="${image#*@}"
            for tag in "${name}:dev" "${name}:sha-${SHA}"; do
              docker buildx imagetools create --tag "${tag}" "${name}@${digest}"
              actual="$(docker buildx imagetools inspect "${tag}" \
                --format '{{ json .Manifest }}' | jq -r .digest)"
              if [[ "${actual}" != "${digest}" ]]; then
                echo "::error::${tag} points to ${actual}, expected ${digest}"
                exit 1
              fi
            done
          done

  # The only check to require: passes if every other job passed, or was skipped
  # where that is intended: `push` and `publish` on pull requests (they run on
  # pushes only). Any other result (failure, cancelled, or an unintended skip)
  # fails it. Add every new job to `needs`
  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [title, test, chart, smoke, push, scan, publish]
    permissions: {}
    steps:
      - name: Check results of all jobs
        uses: elixir-cloud-aai/.github/actions/gate@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          # `title` is skipped on purpose on pushes and for Dependabot, `push`
          # and `publish` on pull requests only
          allow-skipped: ${{ github.event_name == 'pull_request' && 'title push publish' || 'title' }}
