# FOCA configuration. Defaults that are safe to publish in the image: deployments
# mount their own copy, with their admin users (see the README). The environment
# variable MONGO_HOST takes precedence over `db.host`
server:
    host: '0.0.0.0'
    port: 8080
    debug: False
    environment: production
    testing: False
    use_reloader: False

db:
    host: mongodb
    port: 27017
    dbs:
        pubgradeStore:
            collections:
                repositories:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                builds:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                subscriptions:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                users:
                    indexes:
                        - keys:
                              uid: 1
                          options:
                            'unique': True
                admin_users:
                    indexes:
                        - keys:
                              uid: 1
                          options:
                            'unique': True

api:
    specs:
        - path:
            - api/pubgrade.yaml
          append: null
          add_operation_fields:
              x-openapi-router-controller: pubgrade.modules.server
          connexion:
              strict_validation: True
              validate_responses: True
              options:
                  swagger_ui: True
                  serve_spec: True

exceptions:
     required_members: [['msg'], ['status_code']]
     status_member: ['status_code']
     exceptions: pubgrade.errors.exceptions.exceptions

log:
    version: 1
    disable_existing_loggers: False
    formatters:
        standard:
            class: logging.Formatter
            style: "{"
            format: "[{asctime}: {levelname:<8}] {message} [{name}]"
    handlers:
        console:
            class: logging.StreamHandler
            level: 20
            formatter: standard
            stream: ext://sys.stderr
    root:
        level: 10
        handlers: [console]

# Custom app configuration
endpoints:
    repository:
        # Switch off after setup to close registration
        registration_enabled: True
        id_charset: [string.ascii_lowercase, string.digits , '.' , '-']
        id_length: 6
        retries: 3
    user:
        # Switch off after setup to close registration
        registration_enabled: True
        uid_charset: [string.ascii_lowercase, string.digits , '.' , '-']
        uid_length: 6
        retries: 3
    access_token:
        charset: [ string.ascii_lowercase, string.digits , '.' , '-' ]
        length: 32
    subscriptions:
      # Switch off after setup to close registration
      registration_enabled: True
      # Seconds for each call to a subscriber, to connect and for the response.
      # Publishing waits for this, so with both, keep it below the time limit
      # of the Route or Ingress (e.g., 30 seconds by default on OpenShift)
      notification_timeout: 10
      # Each subscriber of a repository gets its own thread when publishing
      max_per_repository: 100
      # Users that can verify other users: `name`, `uid`, `user_access_token`.
      # At each start, the database is made to match this list
      admin_users: []
    builds:
        # Off: `POST /repositories/{id}/builds` takes a prebuilt image from the
        # repository's own CI and notifies the subscriptions. On: Pubgrade
        # clones the repository and builds the image; needs the settings below
        enabled: False
        # GitHub repository, `<owner>/<name>`, with the workflow that signs images
        gh_action_path: ""
        # Registry path for built images, with `{}` for the image's name
        intermediate_registery_format: ""
