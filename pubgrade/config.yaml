# FOCA configuration
server:
    host: '0.0.0.0'
    port: 8080
    debug: True
    environment: development
    testing: True
    use_reloader: True

db:
    host: mongodb.pubgrade-ns
    port: 27017
    dbs:
        pubgradeStore:
            collections:
                repositories:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                builds:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                subscriptions:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                users:
                    indexes:
                        - keys:
                              uid: 1
                          options:
                            'unique': True
                admin_users:
                    indexes:
                        - keys:
                              uid: 1
                          options:
                            'unique': True

api:
    specs:
        - path:
            - api/pubgrade.yaml
          append: null
          add_operation_fields:
              x-openapi-router-controller: pubgrade.modules.server
          connexion:
              strict_validation: True
              validate_responses: True
              options:
                  swagger_ui: True
                  serve_spec: True

exceptions:
     required_members: [['msg'], ['status_code']]
     status_member: ['status_code']
     exceptions: pubgrade.errors.exceptions.exceptions

log:
    version: 1
    disable_existing_loggers: False
    formatters:
        standard:
            class: logging.Formatter
            style: "{"
            format: "[{asctime}: {levelname:<8}] {message} [{name}]"
    handlers:
        console:
            class: logging.StreamHandler
            level: 20
            formatter: standard
            stream: ext://sys.stderr
    root:
        level: 10
        handlers: [console]

# Custom app configuration
endpoints:
    repository:
        # Switch off after setup to close registration
        registration_enabled: True
        id_charset: [string.ascii_lowercase, string.digits , '.' , '-']
        id_length: 6
        retries: 3
    user:
        uid_charset: [string.ascii_lowercase, string.digits , '.' , '-']
        uid_length: 6
        retries: 3
    access_token:
        charset: [ string.ascii_lowercase, string.digits , '.' , '-' ]
        length: 32
    subscriptions:
      # Switch off after setup to close registration
      registration_enabled: True
      # Seconds for each call to a subscriber, to connect and for the response.
      # Publishing waits for this, so with both, keep it below the time limit
      # of the Route or Ingress (e.g., 30 seconds by default on OpenShift)
      notification_timeout: 10
      admin_users:
        - name: 'Akash'
          uid: 'akash.saini'
          user_access_token: 'c42a6d44e3d0'
        - name: 'Alvaro'
          uid: 'alvaro.gonzalez'
          user_access_token: 'c42fhg44e3d0'
    builds:
        # Off: `POST /repositories/{id}/builds` takes a prebuilt image from the
        # repository's own CI and notifies the subscriptions. On: Pubgrade
        # clones the repository and builds the image; needs the settings below
        enabled: False
        gh_action_path: "akash2237778/pubgrade-signer"
        intermediate_registery_format: "cloud-registry.2.rahtiapp.fi/pubgrade/{}:1h"