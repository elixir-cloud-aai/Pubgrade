# FOCA configuration. Defaults that are safe to publish in the image: deployments
# mount their own copy, with their admin users (see the README). The environment
# variable MONGO_HOST takes precedence over `db.host`
# `host` and `port` apply to the development server (`python -m pubgrade.app`)
# only: the image serves the app with Gunicorn on port 8080 (FOCA's
# `foca.gunicorn_config`)
server:
    host: '0.0.0.0'
    port: 8080
    debug: False
    testing: False
    # Size limit of request bodies, in bytes (1 MiB); larger requests are
    # rejected with `413 Content Too Large` before they are read
    max_content_length: 1048576

db:
    host: mongodb
    port: 27017
    dbs:
        pubgradeStore:
            collections:
                repositories:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                builds:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                subscriptions:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                        # Subscriptions of a repository: its limit, its deletion
                        - keys:
                              repository_id: 1
                users:
                    indexes:
                        - keys:
                              uid: 1
                          options:
                            'unique': True
                admin_users:
                    indexes:
                        - keys:
                              uid: 1
                          options:
                            'unique': True

# API specifications, by name; paths are relative to this file
api:
    specs:
        pubgrade:
            path: api/pubgrade.yaml
            add_operation_fields:
                x-openapi-router-controller: pubgrade.modules.server
            connexion:
                strict_validation: True
                validate_responses: True
                options:
                    swagger_ui: True
                    serve_spec: True

# Errors are returned as problem details (RFC 9457)
exceptions:
    mapping: pubgrade.errors.exceptions.exceptions

log:
    version: 1
    disable_existing_loggers: False
    formatters:
        standard:
            class: logging.Formatter
            style: "{"
            format: "[{asctime}: {levelname:<8}] {message} [{name}]"
    handlers:
        console:
            class: logging.StreamHandler
            level: 20
            formatter: standard
            stream: ext://sys.stderr
    root:
        level: 10
        handlers: [console]

# Custom app configuration
endpoints:
    # Character sets (`id_charset`, `uid_charset`, `charset`): names such as
    # `string.digits` and literal characters (see "Configuration" in
    # `docs/deployment.md`; checked at start)
    repository:
        # Switch off after setup to close registration
        registration_enabled: True
        id_charset: [string.ascii_lowercase, string.digits , '.' , '-']
        id_length: 6
        retries: 3
    user:
        # Switch off after setup to close registration
        registration_enabled: True
        uid_charset: [string.ascii_lowercase, string.digits , '.' , '-']
        uid_length: 6
        retries: 3
    access_token:
        charset: [ string.ascii_lowercase, string.digits , '.' , '-' ]
        length: 32
    subscriptions:
      # Switch off after setup to close registration
      registration_enabled: True
      # Seconds for each call to a subscriber, to connect and for the response.
      # Publishing waits for this, so with both, keep it below the time limit
      # of the Route or Ingress (e.g., 30 seconds by default on OpenShift)
      notification_timeout: 10
      # Each subscriber of a repository gets its own thread when publishing
      max_per_repository: 100
      # Users that can verify other users: `name`, `uid`, `user_access_token`.
      # At each start, the database is made to match this list
      admin_users: []
    builds:
        # Off: `POST /repositories/{id}/builds` takes a prebuilt image from the
        # repository's own CI and notifies the subscriptions. On: Pubgrade
        # clones the repository and builds the image; needs the settings below
        enabled: False
        # GitHub repository, `<owner>/<name>`, with the workflow that signs images
        gh_action_path: ""
        # Registry path for built images, with `{}` for the image's name (the
        # last part of its name, e.g., `app`); without a tag, each build gets
        # `build-<build ID>`. If empty, `<host>/<namespace>/{}` from the
        # environment variables `INTERMEDIATE_REGISTRY_HOST` (`docker.io` if
        # unset) and `INTERMEDIATE_REGISTRY_NAMESPACE` (none if unset), which
        # the chart sets from `builds.registry`; if set, it takes precedence
        intermediate_registery_format: ""
