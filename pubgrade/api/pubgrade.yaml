openapi: 3.0.2
info:
  title: 'ELIXIR Pubgrade Registry API Specification'
  version: 2.1.0
  description: |
    Pubgrade leverages the publish-subscribe (pub/sub) pattern to effectively
    decouple continuous integration (CI) from continuous deilivery (CD):
    developers can call Pubgrade in their CI pipelines to notify deployments of
    available updates ("publish"), while deployments can listen to update
    notifications ("subscribe") and trigger specific CD pipelines set up by
    administrators.

    Pubgrade is particularly useful wherever deployments are managed by different
    entities than those managing the underlying code bases, such as in federated
    networks, in which services are deployed at multiple locations by different
    organizations.
  license:
    name: Apache 2.0
    url: 'https://raw.githubusercontent.com/akash2237778/Pubgrade/main/LICENSE'
  contact:
    name: ELIXIR Cloud & AAI
    url: 'https://github.com/elixir-cloud-aai/elixir-cloud-aai'
servers:
  - url: 'http://localhost:8080'
paths:
  /repositories:
    post:
      summary: 'Register repository'
      description: Register a repository to enable publishing updates via the
        `/repositories/{id}/builds` endpoint and allow administrators to
        subscribe to them.
      operationId: postRepositories
      tags:
        - repositories
      requestBody:
        description: Schema for repository
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Repository'
              additionalProperties: false
      responses:
        '200':
          description: 'The repository was successfully registered'
          content:
            application/json:
              schema:
                type: object
                properties:
                    id:
                      type: string
                      description: A unique identifier generated for the
                       repository.
                      example: repository_123
                    access_token:
                      type: string
                      description: Secret to be used to identify the source when
                        publishing updates via `/repositories/{id}/builds`.
                      example: xxxxxxxxxxxxxx
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    get:
      summary: 'List available repositories.'
      description: List available repositories to publish updates via the
        `/repositories/{id}/builds` endpoint. Administrators can use this
        endpoint to get repository identifier which is used to subscribe service
        at `POST /subscriptions` endpoint.
      operationId: getRepositories
      tags:
        - repositories
      responses:
        '200':
          description: 'List of available repositories'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryListItem'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /repositories/{id}:
    get:
      summary: Show repository information.
      description: Show repository information like repository url, repository
        identifier for specific repository.
      operationId: getRepository
      tags:
        - repositories
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identifier generated when first registering the
           repository via `POST /repositories`.
      responses:
        '200':
          description: 'Repository Information'
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/RepositoryListItem'
                  #additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Modify registered repository
      description: Change the URL of a registered repository, and its
        `build_types` if the request gives them. Only the repository's access
        token allows it. The repository keeps its identifier, access token,
        builds and subscriptions (with their `build_types`).
      operationId: putRepositories
      tags:
        - repositories
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identifier generated when first registering the
           repository via `POST /repositories`.
        - in: header
          name: X-Project-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to identify source, generated when first
            registering the repository via `POST /repositories`
      requestBody:
        description: Schema for repository
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Repository'
              additionalProperties: false
      responses:
        '200':
          description: 'The repository was successfully modified'
          content:
            application/json:
              schema:
                type: object
                properties:
                    id:
                      type: string
                      description: Identifier generated when first
                       registering the repository via `POST /repositories`.
                      example: repository_123
                    access_token:
                      type: string
                      description: Secret to be used to identify the source when
                        publishing updates via `/repositories/{id}/builds`.
                      example: xxxxxxxxxxxxxx
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: 'Delete repository'
      description: Delete a repository from Pubgrade permanently, with its
        builds and subscriptions; the subscriptions also disappear from their
        users' lists. Only the repository's access token allows it. Builds
        and subscriptions registered meanwhile get a 404. With builds
        switched on, the builds' pods and files are removed first; if one
        can't be removed, the request fails, the repository with its builds
        and subscriptions stays, and the request can be repeated.
        Deployments that have been notified keep their images.
      operationId: deleteRepository
      tags:
        - repositories
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identifier generated when first registering the
           repository via `POST /repositories`.
        - in: header
          name: X-Project-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to identify source, generated when first
            registering the repository via `POST /repositories`
      responses:
        '200':
          description: 'The repository was successfully deleted.'
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    message:
                      type: string
                      example: Repository deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /repositories/{id}/builds:
    post:
      summary: 'Register new build for repository.'
      description: Register a new build for already registered repository.
        Ideally this endpoint is directly called by continuous integration (CI)
        pipelines. With builds switched off (the default), the request names one
        prebuilt image with a tag and no `location` or `dockerhub_token`, and
        Pubgrade notifies the repository's subscriptions of it; the build's
        `notifications` hold the results. With builds switched on, this endpoint
        triggers a build at Pubgrade; a branch, tag or commit in `head_commit`
        that is empty or isn't in the repository gets a 400. A build that
        can't start isn't kept, unless only creating its pod failed.
      operationId: postBuild
      tags:
        - builds
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identifier generated when first registering the
            repository via `POST /repositories`.
        - in: header
          name: X-Project-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to identify source, generated when first
            registering the repository via `POST /repositories`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BuildRegister'
                - type: object
                  properties:
                            dockerhub_token:
                              type: string
                              description: 'Base 64 encoded USER:PASSWORD to
                               access dockerhub to push image
                                `echo -n USER:PASSWD | base64`'
              #additionalProperties: false
      responses:
        '200':
          description: 'Build identifier'
          content:
            application/json:
              schema:
                type: object
                properties:
                    id:
                      type: string
                      description: Unique identifier generated on registering
                        new build. It can be used later to check build status.
                      example: build_123
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    get:
      summary: 'List available builds for repository.'
      description: List available builds for repository with build information
        like build identifier, build status, build start time etc.
      operationId: getBuilds
      tags:
        - builds
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identifier generated when first registering the
            repository via `POST /repositories`.
      responses:
        '200':
          description: 'List of available builds for the repository'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Build'
                  #additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /repositories/{id}/builds/{build_id}:
    get:
      summary: Show build information.
      description: Show build information like build status, build start time
        etc. for individual build.
      operationId: getBuildInfo
      tags:
        - builds
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identifier generated when first registering the
            repository via `POST /repositories`.
        - in: path
          name: build_id
          required: true
          schema:
            type: string
          description: Identifier generated when registering new build via
            `POST /repositories/{id}/builds`
      responses:
        '200':
          description: 'Build Information'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Build'
                #additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: 'Record the completion of a build (internal callback)'
      description: Internal callback, used with builds switched on by the
        updater to report that a build's pod has succeeded; not a way to
        change a build, which is registered anew with
        `POST /repositories/{id}/builds` instead. Returns 403 with builds
        switched off, and 409 for a build that has been canceled, which then
        doesn't succeed and notifies no one.
      operationId: updateBuild
      tags:
        - builds
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identifier generated when first registering the
            repository via `POST /repositories`.
        - in: path
          name: build_id
          required: true
          schema:
            type: string
          description: Identifier generated when registering new build via
            `POST /repositories/{id}/builds`
        - in: header
          name: X-Project-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to identify source, generated when first
            registering the repository via `POST /repositories`
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                properties:
                    id:
                      type: string
                      description: Unique identifier generated on registering
                        new build. It can be used later to check build status.
                      example: build_123
                additionalProperties: false
      responses:
        '200':
          description: 'Build identifier'
          content:
            application/json:
              schema:
                type: object
                properties:
                    id:
                      type: string
                      description: Unique identifier generated on registering
                        new build. It can be used later to check build status.
                      example: build_123
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: 'Cancel build'
      description: Withdraw a build. Only the repository's access token
        allows it. The build is kept and stays listed, with the status
        `CANCELED`; `finished_at` is set if it hadn't finished. With builds
        switched on, a build that is still running is stopped, its pod and
        files removed; if they can't be removed, the request fails, the build
        stays canceled, and the request can be repeated to stop it again. Its
        completion then gets a 409, so it doesn't succeed and notifies no
        one. Finished builds are only marked. Deployments that have been
        notified keep what they pulled; nothing is undeployed, notified
        again or deleted from a registry. A build that has been canceled
        (and stopped) already gets a 409; an unknown build, or one of another
        repository, gets a 404. There is no way to change a build; register a
        new one instead.
      operationId: deleteBuild
      tags:
        - builds
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identifier generated when first registering the
            repository via `POST /repositories`.
        - in: path
          name: build_id
          required: true
          schema:
            type: string
          description: Identifier generated when registering new build via
            `POST /repositories/{id}/builds`
        - in: header
          name: X-Project-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to identify source, generated when first
            registering the repository via `POST /repositories`
      responses:
        '200':
          description: 'The build was canceled.'
          content:
            application/json:
              schema:
                type: object
                properties:
                    id:
                      type: string
                      description: Identifier of the canceled build.
                      example: build_123
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /subscriptions:
    post:
      summary: Register new subscription.
      description: Register a new subscription to allow deployments get notified
        for available updates of opted repository.
      operationId: postSubscription
      tags:
        - subscriptions
      parameters:
        - in: header
          name: X-User-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to verify and uniquely identify administrator
           and perform their specific tasks.
        - in: header
          name: X-User-Id
          required: true
          schema:
            type: string
          description: Secret used to uniquely identify administrator
           and perform their specific tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
               allOf:
                - $ref: '#/components/schemas/Subscription'
                - type: object
                  properties:
                    access_token:
                        type: string
                        description: Secret used by continuous delivery (CD)
                          pipelines to verify request source for `callback_url`.
                        example: xxxxxxxxxxxx
                  required:
                    - repository_id
                    - callback_url
                    - type
                    - value
                    - access_token
              #additionalProperties: false    #shows error bad request on using
      callbacks:
        notification:
          '{$request.body#/callback_url}':
            put:
              summary: Notification of a new image
              description: Pubgrade calls the subscription's `callback_url`
                when the repository publishes an image whose `head_commit`
                matches the subscription's `type` and `value` and, if the
                subscription has a non-empty `build_types`, whose
                `build_type` is one of them. Only the status
                of the response counts, the body isn't read; a 2xx status
                means `delivered`, any other status, a redirect or no
                response in time means `failed` (see the build's
                `notifications`). In time means within
                `endpoints.subscriptions.notification_timeout` for connecting
                and again for the response, and within twice that plus 5
                seconds in all. Redirects
                aren't followed. A subscriber that takes longer answers at
                once (e.g., with 202) and acts in the background, as
                Pubgrade-Sidecar does. Each call names one image; a service
                with several images gets one call per published image.
                Subscribers match calls by image repository and update
                every container whose image repository equals `image_name`
                to `tag`, as Pubgrade-Sidecar's `PUT /deployment` does.
              parameters:
                - in: header
                  name: X-Access-Token
                  required: true
                  schema:
                    type: string
                  description: The `access_token` given when registering the
                    subscription, for the subscriber to check that the call
                    comes from Pubgrade.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/NotificationRequest'
              responses:
                '2XX':
                  description: The subscriber accepted the notification
                    (`delivered`).
                default:
                  description: The subscriber didn't accept the notification
                    (`failed`).
      responses:
        '200':
          description: 'Subcription successfully created'
          content:
            application/json:
              schema:
                type: object
                properties:
                    subscription_id:
                      type: string
                      description: A unique identifier generated for the
                       subscription.
                      example: subscription-xyz
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    get:
      description: List subcription_id's of all subscribed repositories for
        particular user identified by `X-User-Access-Token`
      summary: List subscribed subscription_id's
      operationId: getSubscriptions
      tags:
        - subscriptions
      parameters:
        - in: header
          name: X-User-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to verify and uniquely identify administrator
           and perform their specific tasks.
        - in: header
          name: X-User-Id
          required: true
          schema:
            type: string
          description: Secret used to uniquely identify administrator
           and perform their specific tasks.
      responses:
        '200':
          description: subcription_id's of subscribed repositories.
          content:
            application/json:
              schema:
                type: array
                items:
                  properties:
                    subscription_id:
                      type: string
                      description: Identifier generated when registering new
                       subscription via `POST /subscriptions`
                      example: subscription-xyz
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /subscriptions/{subscription_id}:
    get:
      summary: Show information for specified subscription.
      description: Show various information like state, update time, build
       identifier, repository identifier etc. for specified subscription_id.
      operationId: getSubscriptionInfo
      tags:
        - subscriptions
      parameters:
        - in: path
          name: subscription_id
          required: true
          schema:
            type: string
          description: Identifier generated when registering new subscription
            via `POST /subscriptions`
        - in: header
          name: X-User-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to verify and uniquely identify administrator
           and perform their specific tasks.
        - in: header
          name: X-User-Id
          required: true
          schema:
            type: string
          description: Secret used to uniquely identify administrator
           and perform their specific tasks.
      responses:
        '200':
          description: 'Subscription Information'
          content:
            application/json:
              schema:
                allOf:
                    - $ref: '#/components/schemas/Subscription'
                    - type: object
                      properties:
                            state:
                                type: string
                                enum:
                                  - Active
                                  - Inactive
                                example: Active
                                description: State of subscription, whether it
                                 is active or inactive at deployments.
                            updated_at:
                                type: string
                                format: date-time
                                example: 2021-06-11T17:32:28Z
                                description: Timestamp taken when `callback_url`
                                 is called.
                            build_id:
                              type: string
                              description: Identifier generated when registering
                               new build via `POST /repositories/{id}/builds`
                              example: build_123
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete subscription
      description: Removes subscription information permanently from pubgrade.
       Stops sending request at callback_url to notify continuous delivery (CD)
       pipeline.
      operationId: deleteSubscription
      tags:
        - subscriptions
      parameters:
        - in: path
          name: subscription_id
          required: true
          schema:
            type: string
          description: Identifier generated when registering new subscription
            via `POST /subscriptions`
        - in: header
          name: X-User-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to verify and uniquely identify administrator
           and perform their specific tasks.
        - in: header
          name: X-User-Id
          required: true
          schema:
            type: string
          description: Identifier used to uniquely identify administrator
           and perform their specific tasks.
      responses:
        '200':
          description: 'The subscription was successfully deleted.'
          content:
            application/json:
              schema:
                type: object
                properties:
                    subscription_id:
                      type: string
                      description: Identifier generated when registering new
                       subscription via `POST /subscriptions`
                      example: subscription-xyz
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /users:
    get:
      summary: List available users.
      description: List information of available user, accessible by super user only.
      operationId: getUsers
      tags:
        - users
      parameters:
        - in: header
          name: X-Super-User-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to verify super user and perform their specific tasks.
        - in: header
          name: X-Super-User-Id
          required: true
          schema:
            type: string
          description: Identifier used to uniquely identify super user
           and perform their specific tasks.
      responses:
        '200':
          description: 'List Information of available users.'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties:
                    name:
                      type: string
                      description: Name of registered user
                      example: 'Akash Saini'
                    uid:
                      type: string
                      description: Identifier used to uniquely identify user.
                      example: '9fe2c4'
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when the user is created.
                      example: '2021-10-07T17:32:28Z'
                    is_verified:
                      type: boolean
                      description: Boolean value of whether the user is verified by super user or not.
                      example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /users/register:
    post:
      summary: Register new user.
      description: Register a new system administrator user to use pubgrade.
      operationId: postUser
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
                  type: object
                  properties:
                    name:
                        type: string
                        description: Name of the user to be registered.
                        example: 'Akash Saini'
                  required:
                    - name
      responses:
        '200':
          description: 'Credentials for the user created.'
          content:
            application/json:
              schema:
                type: object
                properties:
                    uid:
                      type: string
                      description: Identifier used to uniquely identify administrator account.
                      example: '9fe2c4'
                    user_access_token:
                      type: string
                      description: Secret used to verify administrator account.
                      example: 'c42a6d44e3d0'
    delete:
      summary: Delete User
      description: Deletes user object and associated subscriptions for the user.
      operationId: deleteUser
      tags:
        - users
      parameters:
        - in: header
          name: X-User-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to verify and uniquely identify administrator
           and perform their specific tasks.
        - in: header
          name: X-User-Id
          required: true
          schema:
            type: string
          description: Secret used to uniquely identify administrator
           and perform their specific tasks.
      responses:
        '200':
           description: 'User deleted.'
           content:
             application/json:
               schema:
                 type: string
                 example: User deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /users/{uid}/verify:
     put:
       summary: Verify registered administrator.
       description: Used by super user to verify registered administrator. Registered administrator must be verified by super user in order to perform further operations at Pubgrade.
       operationId: verifyUser
       tags:
         - users
       parameters:
         - in: header
           name: X-Super-User-Access-Token
           required: true
           schema:
             type: string
           description: Secret used to verify super user and perform their specific tasks.
         - in: header
           name: X-Super-User-Id
           required: true
           schema:
             type: string
           description: Identifier used to uniquely identify super user
            and perform their specific tasks.
         - in: path
           name: uid
           required: true
           schema:
             type: string
           description: Identifier used to uniquely identify administrator account.
       responses:
         '200':
           description: 'Credentials for the user created.'
           content:
             application/json:
               schema:
                 type: string
                 example: User verified successfully
         '401':
           $ref: '#/components/responses/Unauthorized'
         '404':
           $ref: '#/components/responses/NotFound'
         '500':
           $ref: '#/components/responses/InternalServerError'
         default:
           $ref: '#/components/responses/Error'
  /users/{uid}/unverify:
     put:
       summary: Verify registered administrator.
       description: Used by super user to verify registered administrator. Registered administrator must be verified by super user in order to perform further operations at Pubgrade.
       operationId: unverifyUser
       tags:
         - users
       parameters:
         - in: header
           name: X-Super-User-Access-Token
           required: true
           schema:
             type: string
           description: Secret used to verify super user and perform their specific tasks.
         - in: header
           name: X-Super-User-Id
           required: true
           schema:
             type: string
           description: Identifier used to uniquely identify super user
            and perform their specific tasks.
         - in: path
           name: uid
           required: true
           schema:
             type: string
           description: Identifier used to uniquely identify administrator account.
       responses:
         '200':
           description: 'Credentials for the user created.'
           content:
             application/json:
               schema:
                 type: string
                 example: User unverified successfully
         '401':
           $ref: '#/components/responses/Unauthorized'
         '404':
           $ref: '#/components/responses/NotFound'
         '500':
           $ref: '#/components/responses/InternalServerError'
         default:
           $ref: '#/components/responses/Error'
components:
  responses:
    BadRequest:
      description: 'Bad Request
       ([RFC 7231](https://tools.ietf.org/html/rfc7235))'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'Unauthorized
       ([RFC 7235](https://tools.ietf.org/html/rfc7235))'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Forbidden
       ([RFC 7231](https://tools.ietf.org/html/rfc7231))'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'Not found ([RFC 7231](https://tools.ietf.org/html/rfc7231))'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'Conflict ([RFC 7231](https://tools.ietf.org/html/rfc7231))'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: 'Internal server error
       ([RFC 7231](https://tools.ietf.org/html/rfc7231))'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: 'Unexpected error
       ([RFC 7231](https://tools.ietf.org/html/rfc7231))'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Build:
      description: Describes schema for build.
      allOf:
          - $ref: '#/components/schemas/BuildRegister'
          - type: object
            properties:
              status:
                type: string
                enum:
                  - UNKNOWN
                  - QUEUED
                  - RUNNING
                  - DELETING
                  - SUCCEEDED
                  - FAILED
                  - CANCELED
                example: QUEUED
                description: Current condition/state of build. `CANCELED`
                  builds have been withdrawn by the repository
                  (`DELETE /repositories/{id}/builds/{build_id}`); they keep
                  that status.
              started_at:
                type: string
                format: date-time
                example: 2021-06-11T17:32:28Z
                description: Timestamp taken at the begining of build.
              finished_at:
                type: string
                format: date-time
                nullable: true
                example: 2021-06-11T17:32:28Z
                description: Timestamp taken when build is finished and ready to
                 deploy; null until then.
              notifications:
                type: array
                description: Result of notifying each subscription of the
                 repository, once all of them are done.
                items:
                  $ref: '#/components/schemas/Notification'
            required:
              - status
              - started_at
              - finished_at
    NotificationRequest:
      type: object
      description: Body of the call that notifies a subscriber of a new image
        (callback `notification` of `POST /subscriptions`).
      properties:
        image_name:
          type: string
          description: Name of the image, without its tag, as published, i.e.,
            the image repository, optionally with its registry. Subscribers
            update the containers that use this repository.
          example: elixircloud/tesk-api
        tag:
          type: string
          description: Tag of the image.
          example: v1.2.0
      required:
        - image_name
        - tag
      additionalProperties: false
    Notification:
      type: object
      description: Result of notifying one subscription of a build.
      properties:
        subscription_id:
          type: string
          description: Identifier of the subscription.
          example: subscription123
        result:
          type: string
          enum:
            - delivered
            - failed
            - skipped
          description: "`delivered`: the subscriber responded with a 2xx status.
           `failed`: it responded with another status, or didn't respond in
           time. `skipped`: the subscription doesn't match the build (its
           `type`, `value` or `build_types`), or no longer exists."
        http_status:
          type: integer
          nullable: true
          description: Status of the subscriber's response, if any.
          example: 200
        finished_at:
          type: string
          format: date-time
          description: Time at which the notification finished.
      required:
        - subscription_id
        - result
        - finished_at
    BuildRegister:
      type: object
      description: Describes schema for registering build
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          description: Image of the build, as a list. A prebuilt image must
           be the only entry; with builds on, only the first entry counts.
           Publish further images as builds of their own.
        head_commit:
          type: object
          oneOf:
            - $ref: '#/components/schemas/Branch'
            - $ref: '#/components/schemas/Tag'
          description: "Reference to the `commit` or `tag` which is to be used
           for source code checkout. With builds switched on, the branch and
           the tag must be exact names in the repository, and `commit_sha` a
           commit hash in it (4 to 64 hexadecimal digits); otherwise the
           request gets a 400."
          example: {"branch": "dev", "commit_sha": "4714900" }
        build_type:
          allOf:
            - $ref: '#/components/schemas/BuildType'
          description: Type of the build, one of the repository's
            `build_types` (otherwise the request gets a 400). Subscriptions
            with a non-empty `build_types` get only builds of these types;
            builds without a type go only to subscriptions without them.
      required:
          - images
          - head_commit
    Image:
      type: object
      description: Properties required for building docker image i.e. name/tag
       and location of Dockerfile
      properties:
        name:
          type: string
          description: Image repository and tag used to build image.
          example: akash7778/pubgrade:0.0.1
        location:
          type: string
          description: Location of Dockerfile relative to repository root
           directory.
          default: ./Dockerfile
      required:
            - name
    Branch:
      type: object
      description: 'Git branch: Used as reference for git checkout'
      properties:
            branch:
                type: string
                description: Name of branch to be used to checkout git
                 repository.
                example: dev
            commit_sha:
                type: string
                description: Git commit sha till where repository needs to be
                 checkout by pubgrade. Head commit will be used if `commit_sha`
                  is not supplied in request.
                default: <Head-commit>
                example: 4714900
      required:
        - branch
    Tag:
      type: object
      description: 'Git Tag: Used as reference for git checkout.'
      properties:
          tag:
            type: string
            example: v1.0
      required:
        - tag
    Subscription:
      type: object
      description: Schema for subscription
      properties:
        repository_id:
            type: string
            description: A unique identifier generated on registering new
             repository.
            example: respository123
        callback_url:
            type: string
            format: uri
            description: URL on which continuous delivery (CD) pipeline is
              listening for image updates.
            example: https://ec2-54-203-145-132.compute-1.amazonaws.com/update
        type:
            type: string
            description: Type of `head_commit` listened by subscription for
             updates.
            enum:
              - branch
              - tag
            example: tag
        value:
            type: string
            description: Value to match with type of `head_commit`; `*` matches
              any value of the type.
            example: dev
        build_types:
            type: array
            description: Build types of the repository that the subscription
              gets (each must be one of the repository's `build_types`,
              otherwise the request gets a 400). Missing or empty, it gets
              builds of all types and without a type; otherwise only builds
              whose `build_type` is one of them.
            items:
              $ref: '#/components/schemas/BuildType'
            uniqueItems: true
            maxItems: 50
            example: [production]
    RepositoryListItem:
      description: Schema used to show at `GET /repositories` for repositories.
      allOf:
        - $ref: '#/components/schemas/Repository'
        - type: object
          properties:
            id:
                type: string
                description: A unique identifier generated on registering new
                 repository.
                example: respository123
    Repository:
      description: Schema for repository.
      type: object
      properties:
        url:
          type: string
          description: URL of the git repository.
          example: https://github.com/elixir-cloud-aai/trs-filer.git
        build_types:
          type: array
          description: Build types that the repository's builds may have
            (`build_type`), and that subscriptions may filter on
            (`build_types`). Without them, builds have no type. `PUT
            /repositories/{id}` changes them only if it gives them.
          items:
            $ref: '#/components/schemas/BuildType'
          uniqueItems: true
          maxItems: 50
          example: [production, testing]
      required:
        - url
    BuildType:
      type: string
      description: Name of a build type.
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
      maxLength: 64
      example: production
    Error:
      type: object
      properties:
        status:
          type: integer
          format: int32
          description: |
            HTTP status code (as per
            [RFC 7231](https://tools.ietf.org/html/rfc7231)) generated by the
            server for this occurrence of the problem. This must match the
            status code in the actual HTTP response. Used for convenience of
            clients (e.g. to determine what the original status code was in
            cases where it has been changed by an intermediary or cache or when
            message bodies persist without HTTP information).
          example: 500
        title:
          type: string
          description: |
            A short, human-readable description of the error.
            The value should not change from occurrence to occurrence of an
            error, except for purposes of localization.
          example: 'Internal server error'
        detail:
          type: string
          description: 'A human-readable explanation specific to this occurrence
           of the error.'
          example: 'Internal server error'
      required:
        - status
        - title
