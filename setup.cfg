[coverage:run]
relative_files = True
source =
    pubgrade
    scripts

[coverage:report]
fail_under = 100
# The scripts' entry points, run as programs (their `main` is tested)
exclude_also =
    if __name__ == .__main__.:

[tool:pytest]
# Not the tests of the submodule with Pubgrade-Sidecar (`external/`)
testpaths = tests
